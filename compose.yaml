services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ucaselab}
      POSTGRES_USER: ${POSTGRES_USER:-ucaselab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ucaselab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ucaselab}
    command: [uv, run, --frozen, --no-dev, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ucaselab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ucaselab}
      STORAGE_PATH: /data/attachments
      FORWARDED_ALLOW_IPS: '*'
    volumes:
      - attachments:/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, uv, run, --frozen, --no-dev, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ucaselab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ucaselab}
    command: [uv, run, --frozen, --no-dev, python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${HTTP_PORT:-127.0.0.1:8080}:80'
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  attachments:
