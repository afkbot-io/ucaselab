name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ucaselab
          POSTGRES_PASSWORD: ucaselab-ci
          POSTGRES_DB: ucaselab
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ucaselab" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ucaselab:ucaselab-ci@localhost:5432/ucaselab
      SECRET_KEY: ci-only-non-production-unique-long-secret-key
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
      - run: uv sync --frozen --python 3.13
      - run: uv run alembic upgrade head
      - run: uv run python scripts/check_migrations.py
      - run: uv run ruff check apps/api
      - run: uv run mypy
      - run: uv run python scripts/package_skills.py
      - run: uv run python scripts/check_skills.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q --cov=app --cov-branch --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:output/coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build --prefix apps/web
      - run: npm run typecheck:e2e --prefix apps/web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - run: npm run test:ui --prefix apps/web
      - run: docker compose --env-file .env.example config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            output/coverage.xml
            output/playwright/e2e/report
            output/playwright/e2e/results
            output/playwright/e2e/results.json
          retention-days: 14
