[project]
name = "ucaselab-platform"
version = "1.9.2"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1",
  "sqlalchemy>=2.0.44,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.17,<2", "pydantic-settings>=2.11,<3",
  "email-validator>=2.3,<3", "argon2-cffi>=25.1,<26",
  "cryptography>=46,<48", "mcp>=2,<3", "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5", "httpx>=0.28,<1"
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E712"]

[tool.mypy]
files = ["apps/api/app"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
